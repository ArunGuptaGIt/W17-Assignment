[project]
name = "track-b-agentic-mlops"
version = "0.1.0"
description = "Agentic AI Assistant MLOps Pipeline - Track B"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.0",
    "pypdf>=4.1.0",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "google-genai>=0.1.0",
    "openai>=1.14.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "psutil>=5.9.0",
    "mlflow>=2.10.0",
    "evidently>=0.4.14",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
